<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Honest Gin</title>
<meta name="theme-color" content="#0d3326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Honest Gin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --cw:60px; --ch:84px;
  --felt1:#1d5c45; --felt2:#0b2e22; --ink:#f3efe4; --muted:#a9c2b6;
  --gold:#e3b54f; --card:#fbf8f1; --red:#c0392b; --black:#1d1d1f; --blue:#1f5fbf; --green:#21803a;
  --m1:#e3b54f; --m2:#5fb3e6; --m3:#e67fa8; --m4:#9be36f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--felt2);color:var(--ink);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 35%,var(--felt1),var(--felt2) 75%) fixed}
button{font:inherit;color:inherit}
#app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px);
  user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:10px;padding:4px 2px 8px}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:18px;letter-spacing:.3px;white-space:nowrap}
.brand b{color:var(--gold);font-weight:normal}
.score{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;font-variant-numeric:tabular-nums;background:none;border:none;padding:0;cursor:pointer;color:inherit;font:inherit}
.score .sheet-ico{font-size:15px;opacity:.85}
table.sheet td.res{text-align:left;white-space:nowrap}
table.sheet td.run{color:var(--muted);font-size:12px}
table.sheet tr.tot td,table.sheet tr.tot th{border-top:1px solid rgba(255,255,255,.3);font-weight:700}
.btn.xl{font-size:17px;padding:12px 28px;min-height:48px}
.pill{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap}
.pill b{font-size:15px}
.iconbtn{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);border-radius:10px;width:38px;height:34px;font-size:18px;cursor:pointer}
.zone{position:relative}
#opp{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:calc(var(--ch)*.62 + 26px)}
.who{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.who .dot{width:8px;height:8px;border-radius:50%;background:transparent}
.active .who .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.backs{display:flex;justify-content:center}
.backs .card{width:calc(var(--cw)*.62);height:calc(var(--ch)*.62);margin-left:calc(var(--cw)*-.36)}
.backs .card:first-child{margin-left:0}
#table{display:flex;justify-content:center;align-items:center;gap:calc(var(--cw)*.6);padding:14px 0 6px;flex:1;min-height:calc(var(--ch)*1.1 + 40px)}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px}
.pile .lbl{font-size:12px;color:var(--muted)}
.pilebox{position:relative;width:calc(var(--cw)*1.1);height:calc(var(--ch)*1.1);border-radius:9px;border:2px dashed rgba(255,255,255,.18)}
.pilebox .card{position:absolute;inset:0;width:100%;height:100%}
.pilebox.clickable{cursor:pointer}
.pilebox.clickable::after{content:"";position:absolute;inset:-6px;border-radius:12px;border:2px solid var(--gold);opacity:.85;animation:pulse 1.6s infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
.count{position:absolute;right:-8px;top:-8px;background:#0b2e22;border:1px solid rgba(255,255,255,.3);border-radius:999px;font-size:11px;padding:1px 6px;z-index:5}
.under{transform:translate(-5px,3px) rotate(-5deg);filter:brightness(.85)}
#lock{display:flex;justify-content:center;padding:2px 0 6px}
#lock button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 8px}
#lock code{color:var(--ink);font-size:11.5px}
#msg{text-align:center;min-height:44px;padding:4px 8px;font-size:14.5px}
#msg .sub{display:block;color:var(--muted);font-size:12.5px}
#me{min-height:calc(var(--ch) + 34px)}
#me .who{justify-content:center;margin-bottom:6px}
#hand{position:relative;height:calc(var(--ch) + 18px)}
#hand .card{position:absolute;top:14px;transition:left .22s ease,transform .15s ease;cursor:pointer}
#hand .card.sel{transform:translateY(-14px);box-shadow:0 0 0 2px var(--gold),0 6px 14px rgba(0,0,0,.45)}
#hand .card.locked{filter:saturate(.6) brightness(.93)}
#hand .card.fresh{animation:fresh .45s ease}
@keyframes fresh{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
#controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:2px 0 10px;min-height:52px}
.btn{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:14px;min-height:40px}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--gold);color:#2a1d00;border-color:var(--gold);font-weight:600}
.btn.small{padding:6px 12px;min-height:32px;font-size:13px}
/* Cards */
.card{width:var(--cw);height:var(--ch);background:var(--card);border-radius:calc(var(--cw)*.1);
  box-shadow:0 1px 0 rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.35);position:relative;overflow:hidden;color:var(--black);flex:none}
.card .cr{position:absolute;left:calc(var(--cw)*.07);top:calc(var(--cw)*.05);font-weight:700;line-height:.95;text-align:center;
  font-size:calc(var(--cw)*.3);font-family:var(--face-font,Georgia,"Times New Roman",serif)}
.card .cr i{display:block;font-style:normal;font-size:calc(var(--cw)*.27)}
.card .cc{position:absolute;right:calc(var(--cw)*.08);bottom:calc(var(--cw)*.1);font-size:calc(var(--cw)*.55);line-height:1}
.card.s-H,.card.s-D{color:var(--red)}
.four .card.s-D{color:var(--blue)} .four .card.s-C{color:var(--green)}
.card .bar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--cw)*.09)}
.card.back{background-color:var(--back1,#7a1f2b);
  background-image:repeating-linear-gradient(45deg,var(--back2,rgba(255,215,140,.18)) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,var(--back2,rgba(255,215,140,.18)) 0 2px,transparent 2px 7px);
  border:3px solid var(--backrim,#fbf8f1)}
/* Card back designs */
.back-dots .card.back{background-image:radial-gradient(var(--back2) 18%,transparent 20%),radial-gradient(var(--back2) 18%,transparent 20%);background-size:8px 8px;background-position:0 0,4px 4px}
.back-stripes .card.back{background-image:repeating-linear-gradient(90deg,var(--back2) 0 3px,transparent 3px 8px)}
.back-plain .card.back{background-image:linear-gradient(transparent,transparent);box-shadow:inset 0 0 0 calc(var(--cw)*.06) var(--back1),inset 0 0 0 calc(var(--cw)*.08) var(--back2),0 3px 8px rgba(0,0,0,.35)}
/* Card face styles */
.face-modern{--face-font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.face-modern .card .cr{letter-spacing:-.02em}
.face-jumbo{--face-font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.face-jumbo .card .cr{font-size:calc(var(--cw)*.42);font-weight:800;letter-spacing:-.04em}
.face-jumbo .card .cr i{font-size:calc(var(--cw)*.34)}
.face-jumbo .card .cc{font-size:calc(var(--cw)*.42);opacity:.85}
.face-vintage{--face-font:Georgia,"Times New Roman",serif}
.face-vintage .card .cr{font-style:italic}
.face-vintage .card{background-image:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(120,80,30,.16))}
.mini{--cw:38px;--ch:53px}
.mini .card{margin-right:-12px}
.mini .card.laid{box-shadow:0 0 0 2px var(--m2);}
.mini .card.dead{filter:none}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:calc(env(safe-area-inset-top) + 10px) 8px 0}
#modal[hidden]{display:none}
.sheet{background:#13261f;border:1px solid rgba(255,255,255,.12);border-bottom:none;border-radius:18px 18px 0 0;width:100%;max-width:640px;
  max-height:92vh;overflow:auto;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:up .25s ease}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid rgba(255,255,255,.12)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:Georgia,serif;font-weight:normal;margin:0 0 4px;font-size:22px}
.sheet h3{margin:16px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:6px 0;color:#d9e4de}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.handrow{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding:6px 0 4px 2px}
.grp{display:flex;padding-right:12px}
.grp.deadgrp{opacity:.95;outline:1px dashed rgba(255,255,255,.25);outline-offset:3px;border-radius:6px}
.tag{font-size:12px;color:var(--muted)}
.big{font-size:28px;font-family:Georgia,serif;color:var(--gold)}
.ok{color:#8fe39a} .bad{color:#ff8a80}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;color:#e8efe9}
details{margin-top:8px} summary{cursor:pointer;color:var(--muted)}
ol.log{padding-left:20px;margin:6px 0;color:#d9e4de;font-size:13.5px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.seg button{background:none;border:none;padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--gold);color:#2a1d00;font-weight:600}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px}
.cell{aspect-ratio:.72;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.05;font-weight:600;
  background:rgba(255,255,255,.06);color:#6f8f80}
.cell.mine{background:var(--card);color:var(--black);box-shadow:0 0 0 2px var(--m2)}
.cell.gone{background:rgba(255,255,255,.18);color:#c8d6cf;text-decoration:line-through}
.cell.opp{background:#ffd6d1;color:#8a1c12;box-shadow:0 0 0 2px #ff8a80}
.cell.r{color:#e57373}.cell.mine.r{color:var(--red)}
.cell.mine.known{box-shadow:0 0 0 2px var(--gold)}
.lgd{display:grid;gap:6px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.lgd div{display:flex;align-items:center;gap:8px}
.lgd i.cell{flex:none;width:20px;height:27px;aspect-ratio:auto;font-style:normal;font-size:11px}
.cell.faded{background:rgba(255,255,255,.07);color:#8aa398;outline:1px dashed rgba(255,255,255,.3);outline-offset:-2px}
.cell.wrong{background:#3b2d5e;color:#d9c8ff;outline:1px dashed #9b7fd1;outline-offset:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
pre.code{background:#0b1813;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px;overflow:auto;font-size:11.5px;max-height:220px}
textarea.copyfb{position:absolute;left:-9999px}
/* End-of-hand reveal on the table */
#oppHand{position:relative;width:100%}
#oppHand .card{position:absolute;top:4px}
#oppHand .card.laid,#hand .card.laid{box-shadow:0 0 0 2px var(--m2),0 3px 8px rgba(0,0,0,.35)}
.who b.dw{color:var(--ink);font-weight:700}
.pop{position:fixed;z-index:45;pointer-events:none;font:700 30px Georgia,serif;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.6);white-space:nowrap}
.pill.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18);background:rgba(227,181,79,.35)}}
#msg .verdict{font-size:19px}
#msg .verdict b{color:var(--gold)}
/* Flying cards */
.fly{position:fixed;z-index:40;pointer-events:none;perspective:700px;will-change:transform}
.fly .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.fly .flip>.card{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 10px rgba(0,0,0,.3)}
/* Appearance sheet */
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,181,79,.35)}
.swcard{--cw:34px;--ch:48px;cursor:pointer;border-radius:6px;padding:3px;border:2px solid transparent;background:none}
.swcard.on{border-color:var(--gold)}
.colorpick{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.colorpick input{width:40px;height:34px;border:none;background:none;padding:0;cursor:pointer}
.preview{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;border-radius:12px;margin:8px 0 2px;
  background:radial-gradient(120% 120% at 50% 30%,var(--felt1),var(--felt2));--cw:52px;--ch:73px}
.fly .flip>.card.back{transform:rotateY(180deg)}
#disc .card.land{animation:land .3s ease}
@keyframes land{0%{transform:scale(1.08)}100%{transform:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Honest <b>Gin</b></div>
    <button class="score" id="score" aria-label="Score sheet"></button>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
  </header>
  <section id="opp" class="zone"></section>
  <section id="table"></section>
  <div id="lock"></div>
  <div id="msg"></div>
  <div id="controls"></div>
  <section id="me" class="zone">
    <div class="who"><span class="dot"></span><span id="meLabel">You</span></div>
    <div id="hand"></div>
  </section>
</div>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script src="engine.js"></script>
<script>
(function(){
'use strict';
const E = window.Gin;
const $ = s => document.querySelector(s);
const SUITORDER = {S:0,H:1,C:2,D:3};
const MELDCOL = ['var(--m1)','var(--m2)','var(--m3)','var(--m4)'];
const DIFF_LABEL = {easy:'Easy', normal:'Normal', hard:'Hard'};
const MEM_LABEL = {perfect:'Perfect memory', human:'Human memory', forgetful:'Forgetful'};
const MEM_SHORT = {perfect:'Perfect', human:'Human', forgetful:'Forgetful'};
const MEM_HELP = {
  perfect: 'Remembers every card that has been seen, for the whole hand — like a computer.',
  human: 'Remembers recent cards well, but older discards slowly slip its mind, it sometimes misremembers what you picked up, and now and then it overlooks a useful card on the discard pile.',
  forgetful: 'Mostly reacts to what’s on top of the discard pile. Forgets almost everything older than a turn or two, and overlooks useful cards more often.' };
const oppTitle = () => `Opponent · ${DIFF_LABEL[settings.difficulty]} · ${MEM_LABEL[settings.memory] || MEM_LABEL.human}`;
const KEY = 'honest-gin.v1';

// ---------- persistence ----------
let store = load() || {};
const settings = Object.assign({difficulty:'normal', target:100, fourColor:false, sort:'suit',
  memory:'human', speed:'normal', table:'green', tableCustom:'#2e6b4f', face:'classic', back:'burgundy', backCustom:'#7a1f2b', backPattern:'lattice'}, store.settings);
if (settings.sort!=='suit' && settings.sort!=='rank') settings.sort = 'suit';
const stats = Object.assign({byMem:{}, games:0, gamesWon:0, hands:0, handsWon:0, aiHandsWon:0, draws:0, gins:0, aiGins:0,
  undercuts:0, aiUndercuts:0, startSum:[0,0], startN:0, firstDrawMelds:[0,0]}, store.stats);
let history = store.history || [];
let g = store.g || null;
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify({settings, stats, history, g})); } catch(e){} }

function memStats(){ stats.byMem = stats.byMem || {}; const k = settings.memory || 'human';
  return stats.byMem[k] = Object.assign({games:0, gamesWon:0, hands:0, handsWon:0, aiHandsWon:0}, stats.byMem[k]); }
// ---------- UI state ----------
let selected = null, freshId = null, aiTimer = null, oppText = '', modalOpen = false, errText = '';

// ---------- helpers ----------
const lbl = E.label;
function cardHTML(id, extra='', bar=null){
  if (!id) return `<div class="card back ${extra}"></div>`;
  const r = id[0]==='T' ? '10' : id[0], s = E.SYM[id[1]];
  return `<div class="card s-${id[1]} ${extra}" data-id="${id}"><span class="cr">${r}<i>${s}</i></span><span class="cc">${s}</span>${bar?`<span class="bar" style="background:${bar}"></span>`:''}</div>`;
}
const backHTML = (extra='') => `<div class="card back ${extra}"></div>`;
function sortCards(cards, mode){
  const c = cards.slice();
  if (mode==='rank') c.sort((a,b)=>E.R(a)-E.R(b) || SUITORDER[E.S(a)]-SUITORDER[E.S(b)]);
  else c.sort((a,b)=>SUITORDER[E.S(a)]-SUITORDER[E.S(b)] || E.R(a)-E.R(b));
  return c;
}
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---------- sizing ----------
function size(){
  const W = Math.min(window.innerWidth, 820) - 16, H = window.innerHeight;
  const cw = Math.round(Math.max(44, Math.min(W/7.2, H*0.105, 86)));
  document.documentElement.style.setProperty('--cw', cw+'px');
  document.documentElement.style.setProperty('--ch', Math.round(cw*1.4)+'px');
  return cw;
}

// ---------- appearance ----------
const TABLES = { green:['#1d5c45','#0b2e22','Green felt'], blue:['#1f4e79','#0b1f33','Blue felt'], burgundy:['#6b2233','#2a0c14','Burgundy'],
  teal:['#146b6b','#062b2b','Teal'], purple:['#4b2d6b','#1a0f29','Purple'], charcoal:['#3a3f44','#141618','Charcoal'], wood:['#7a5333','#3a2414','Walnut'] };
const BACKS = { burgundy:['#7a1f2b','rgba(255,215,140,.2)','#fbf8f1','Burgundy'], navy:['#1d3461','rgba(170,200,255,.22)','#fbf8f1','Navy'],
  forest:['#1f5136','rgba(210,240,200,.2)','#fbf8f1','Forest'], noir:['#141414','rgba(227,181,79,.42)','#e3b54f','Black & gold'],
  scarlet:['#b3261e','rgba(255,255,255,.22)','#ffffff','Scarlet'], royal:['#4a2a7a','rgba(230,200,255,.22)','#fbf8f1','Royal'] };
const FACES = { classic:['#fbf8f1','Classic'], modern:['#ffffff','Modern'], jumbo:['#ffffff','Jumbo'], vintage:['#f2e6cc','Vintage'] };
const PATTERNS = { lattice:'Lattice', dots:'Dots', stripes:'Stripes', plain:'Framed' };
const SPEEDS = { off:0, fast:0.55, normal:1, slow:1.7 };
function shade(hex, f){ // f<1 darkens
  const n = parseInt(hex.slice(1),16), c = [n>>16, (n>>8)&255, n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f))));
  return '#' + c.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function hexToRgba(hex, a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function applyTheme(){
  const root = document.documentElement.style;
  const [f1, f2] = settings.table==='custom' ? [settings.tableCustom, shade(settings.tableCustom, .42)] : (TABLES[settings.table]||TABLES.green);
  root.setProperty('--felt1', f1); root.setProperty('--felt2', f2);
  let b1, b2, rim;
  if (settings.back==='custom'){ b1 = settings.backCustom; b2 = 'rgba(255,255,255,.22)'; rim = '#fbf8f1'; }
  else [b1, b2, rim] = BACKS[settings.back] || BACKS.burgundy;
  root.setProperty('--back1', b1); root.setProperty('--back2', b2); root.setProperty('--backrim', rim);
  root.setProperty('--card', (FACES[settings.face]||FACES.classic)[0]);
  const cl = document.body.classList;
  [...cl].filter(c=>/^(face|back)-/.test(c)).forEach(c=>cl.remove(c));
  cl.add('face-' + settings.face, 'back-' + settings.backPattern);
  cl.toggle('four', !!settings.fourColor);
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = f2;
}
const speed = () => SPEEDS[settings.speed] ?? 1;

// ---------- animation ----------
const MOVE_MS = 460;
let busyUntil = 0, dealUntil = 0;
const reduceMotion = (()=>{ try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
const rectOf = el => el ? el.getBoundingClientRect() : null;
const discTopEl = () => $('#disc .card:not(.under)');
const handCardEl = id => document.querySelector(`#hand .card[data-id="${id}"]`);
const oppBacks = () => [...document.querySelectorAll('#opp .backs .card')];
function markBusy(ms){ busyUntil = Math.max(busyUntil, Date.now() + ms); }
// Fly a card from a screen rectangle to an element. faces: 'up' | 'down' at start and end (flips in the air).
function fly(from, toEl, id, startFace, endFace, dur = MOVE_MS, delay = 0){
  if (!from || !toEl || reduceMotion || !toEl.animate || !speed()) return;
  dur *= speed(); delay *= speed();
  const to = toEl.getBoundingClientRect();
  if (!to.width) return;
  const f = document.createElement('div');
  f.className = 'fly';
  f.style.cssText = `left:${to.left}px;top:${to.top}px;width:${to.width}px;height:${to.height}px;--cw:${to.width}px;--ch:${to.height}px`;
  f.innerHTML = `<div class="flip">${id ? cardHTML(id) : ''}${backHTML()}</div>`;
  document.body.appendChild(f);
  toEl.style.visibility = 'hidden';
  const dx = from.left - to.left, dy = from.top - to.top, sx = from.width / to.width, sy = from.height / to.height;
  const ease = 'cubic-bezier(.25,.75,.3,1)';
  const a = f.animate([
    { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` },
    { transform: `translate(${dx*0.45}px,${dy*0.45 - 18}px) scale(${(sx+1)/2*1.06},${(sy+1)/2*1.06})`, offset: 0.55 },
    { transform: 'none' }], { duration: dur, delay, easing: ease, fill: 'both' });
  const rot = x => x === 'down' ? 180 : 0;
  f.firstChild.animate([{ transform: `rotateY(${rot(startFace)}deg)` }, { transform: `rotateY(${rot(endFace)}deg)` }],
    { duration: dur * 0.8, delay: delay + dur * 0.1, easing: 'ease-in-out', fill: 'both' });
  const done = () => { toEl.style.visibility = ''; f.remove(); if (toEl.parentNode && toEl.closest('#disc')) { toEl.classList.remove('land'); void toEl.offsetWidth; toEl.classList.add('land'); } };
  a.onfinish = done; a.oncancel = done;
  markBusy(dur + delay);
}
// Smoothly slide hand cards from where they were to where they are now.
function slideHand(prev){
  if (reduceMotion || !speed()) return;
  document.querySelectorAll('#hand .card').forEach(el => {
    const p = prev[el.dataset.id]; if (p == null || !el.animate) return;
    const dx = p - el.getBoundingClientRect().left;
    if (Math.abs(dx) < 1) return;
    const lift = el.classList.contains('sel') ? ' translateY(-14px)' : '';
    el.animate([{ transform: `translateX(${dx}px)${lift}` }, { transform: `none${lift ? lift : ''}`.replace('none ', '') }],
      { duration: 280 * speed(), easing: 'cubic-bezier(.25,.75,.3,1)' });
  });
}
function handPositions(){
  const m = {}; document.querySelectorAll('#hand .card').forEach(el => m[el.dataset.id] = el.getBoundingClientRect().left); return m;
}
// Deal animation: cards leave the stock one at a time, alternating, like a real deal.
function dealAnim(){
  if (reduceMotion || !speed()) return;
  const h = g.hand, from = rectOf($('#stock')), nd = 1 - g.dealer, backs = oppBacks();
  if (!from) return;
  let oppI = 0, k = 0;
  const step = 55, dur = 340;
  for (let i = 0; i < 10; i++) for (const p of [nd, g.dealer]) {
    const id = h.deck[k];
    if (p === 0) fly(from, handCardEl(id), id, 'down', 'up', dur, k * step);
    else fly(from, backs[oppI++], null, 'down', 'down', dur, k * step);
    k++;
  }
  fly(from, discTopEl(), h.discard[0], 'down', 'up', dur, k * step);
  dealUntil = Date.now() + (k * step + dur) * speed();
}

// ---------- game flow ----------
function newGame(){
  clearTimeout(aiTimer);
  g = { dealer: Math.random()<0.5?0:1, scores:[0,0], handsWon:[0,0], target: settings.target, handNo:0, over:null, log:[] };
  startHand();
}
function startHand(){
  E.startHand(g);
  selected = null; freshId = null; oppText = ''; errText='';
  const h = g.hand;
  stats.startSum[0] += h.startDw[0]; stats.startSum[1] += h.startDw[1]; stats.startN++;
  save(); render(); dealAnim(); maybeAI();
}
// Runs a rule action, re-renders, then plays the animation for it (anim gets called after render).
function act(fn, anim){
  const err = fn();
  if (err){ errText = err; render(); return false; }
  errText = '';
  const prev = handPositions();
  save(); render(); slideHand(prev);
  if (anim) anim();
  if (g.hand.phase==='over') return setTimeout(handOver, Math.max(450, busyUntil - Date.now() + 250)), true;
  maybeAI(); return true;
}
function maybeAI(){
  clearTimeout(aiTimer);
  const h = g.hand;
  if (!h || h.phase==='over' || h.turn!==1) return;
  const base = (h.phase==='discard' ? 800 : 700) * Math.max(0.5, Math.min(speed() || 0.5, 1.4));
  aiTimer = setTimeout(stepAI, Math.max(base, busyUntil - Date.now() + 350));
}
function stepAI(){
  const h = g.hand; if (h.phase==='over' || h.turn!==1) return;
  // Remember where things are on screen before the move, so the card can fly from there.
  const stockR = rectOf($('#stock')), discR = rectOf(discTopEl()), backs = oppBacks();
  const backR = rectOf(backs[Math.floor(backs.length / 2)]);
  const out = E.aiAct(g, 1, settings.difficulty, settings.memory);
  switch(out.kind){
    case 'pass': oppText = `Opponent passed on the ${lbl(out.card)}.`; break;
    case 'takeUp': oppText = `Opponent took the upcard ${lbl(out.card)}.`; break;
    case 'takeDiscard': oppText = `Opponent took ${lbl(out.card)} from the discard pile.`; break;
    case 'drawStock': oppText = 'Opponent drew from the stock.'; break;
    case 'discard': oppText = oppText.replace(/\.$/, '') + ` and discarded ${lbl(out.card)}.`; break;
    case 'knock': oppText = 'Opponent knocked!'; break;
    case 'gin': oppText = 'Opponent went Gin!'; break;
    case 'bigGin': oppText = 'Opponent went Big Gin!'; break;
  }
  if (out.kind==='discard' && !/drew|took/.test(oppText)) oppText = `Opponent discarded ${lbl(out.card)}.`;
  save(); render();
  const lastBack = () => oppBacks().slice(-1)[0];
  if (out.kind==='drawStock') fly(stockR, lastBack(), null, 'down', 'down');
  else if (out.kind==='takeDiscard' || out.kind==='takeUp') fly(discR, lastBack(), out.card, 'up', 'down');
  else if (out.kind==='discard') fly(backR, discTopEl(), out.card, 'down', 'up');
  if (h.phase==='over') return setTimeout(handOver, Math.max(600, busyUntil - Date.now() + 300));
  maybeAI();
}
function handOver(){
  const h = g.hand;
  if (!h.applied){
    h.applied = true;
    h.prevScores = g.scores.slice();
    const r = h.result;
    stats.hands++;
    if (r.type==='draw') stats.draws++;
    else {
      if (r.winnerP===0) stats.handsWon++; else stats.aiHandsWon++;
      const bm = memStats(); bm.hands++; if (r.winnerP===0) bm.handsWon++; else bm.aiHandsWon++;
      if (r.type==='gin'||r.type==='bigGin'){ if (r.knockerP===0) stats.gins++; else stats.aiGins++; }
      if (r.type==='undercut'){ if (r.winnerP===0) stats.undercuts++; else stats.aiUndercuts++; }
    }
    history.unshift({n:g.handNo, commit:h.commit, seed:h.seed, when:Date.now(),
      res: r.type==='draw' ? 'Dead hand' : `${r.winnerP===0?'You':'Opponent'} +${r.points} (${r.type==='bigGin'?'big gin':r.type})`});
    history = history.slice(0, 40);
    g.log = g.log || [];
    g.log.push({ n:g.handNo, type:r.type, w:r.winnerP, k:r.knockerP, pts:r.points||0 });
    const fin = E.applyResult(g);
    if (fin){ stats.games++; if (fin.winner===0) stats.gamesWon++; const bm = memStats(); bm.games++; if (fin.winner===0) bm.gamesWon++; }
    save();
  }
  startReveal();
}

// ---------- human actions ----------
function onStock(){
  const h = g.hand;
  if (h.turn!==0 || h.phase!=='draw') return;
  const from = rectOf($('#stock'));
  act(()=>E.drawStock(g,0), ()=>fly(from, handCardEl(h.lastDrawn[0]), h.lastDrawn[0], 'down', 'up'));
}
function onDiscardPile(){
  const h = g.hand;
  if (h.turn!==0) return;
  if (h.phase==='upcard' || (h.phase==='draw' && !h.mustStock)){
    const from = rectOf(discTopEl());
    act(()=>E.takeDiscard(g,0), ()=>fly(from, handCardEl(h.lastDrawn[0]), h.lastDrawn[0], 'up', 'up'));
  } else if (h.phase==='discard' && selected){ doDiscard(selected); }
}
function onCard(id){
  const h = g.hand;
  if (h.turn!==0 || h.phase!=='discard'){ return; }
  if (id === h.taken){ errText = "You can't throw back the card you just picked up."; selected=null; render(); return; }
  if (selected === id) return doDiscard(id);
  selected = id; errText=''; render();
}
function doDiscard(id){
  const c = id, from = rectOf(handCardEl(id)); selected = null; freshId = null; oppText = '';
  act(()=>E.discardCard(g,0,c), ()=>fly(from, discTopEl(), c, 'up', 'up'));
}
function doKnock(){
  if (!selected) return;
  const c = selected; selected = null; freshId = null; oppText = '';
  act(()=>E.knock(g,0,c));
}
function doBigGin(){ selected=null; act(()=>E.bigGin(g,0)); }
function doPass(){ oppText=''; act(()=>E.pass(g,0)); }

// ---------- score sheet ----------
const isIdle = () => !g || !g.hand || !!(g.over && g.overSeen);
function resultLabel(e){
  const who = p => p===0 ? 'You' : 'Opponent';
  if (e.type==='draw') return 'Dead hand';
  return { gin:`${who(e.k)} gin`, bigGin:`${who(e.k)} big gin`, knock:`${who(e.k)} knocked`, undercut:`${who(e.w)} undercut` }[e.type];
}
function scoreSheetHTML(){
  if (!g) return '<p class="tag">No game in progress.</p>';
  const log = g.log || [], run = [0,0];
  const rows = log.map(e=>{
    const scored = e.type!=='draw';
    if (scored) run[e.w] += e.pts;
    return `<tr><td>${e.n}</td><td class="res">${resultLabel(e)}</td><td>${scored&&e.w===0?'+'+e.pts:''}</td><td>${scored&&e.w===1?'+'+e.pts:''}</td><td class="run">${run[0]}–${run[1]}</td></tr>`;
  }).join('');
  return `<table class="t sheet"><tr><th>#</th><th style="text-align:left">Hand</th><th>You</th><th>Opp</th><th></th></tr>
    ${rows || '<tr><td colspan="5" class="tag" style="text-align:left">No hands finished yet.</td></tr>'}
    <tr class="tot"><td></td><td class="res">Total</td><td>${g.scores[0]}</td><td>${g.scores[1]}</td><td></td></tr>
    <tr><td></td><td class="res">Hands won</td><td>${g.handsWon[0]}</td><td>${g.handsWon[1]}</td><td></td></tr></table>
    <div class="tag" style="margin-top:6px">First to ${g.target}. Winner gets +${E.BONUS.game}, and each player +${E.BONUS.box} per hand won.</div>`;
}
function showScoreSheet(){
  openModal(`<h2>Score sheet</h2>${scoreSheetHTML()}
    <div class="row" style="margin-top:14px"><button class="btn" data-act="close">Close</button></div>`,
    ev=>{ if (ev.target.closest('[data-act=close]')) closeModal(); });
}
function renderHeader(override){
  const sc = override || (g ? g.scores : [0,0]), tgt = g ? g.target : settings.target;
  $('#score').innerHTML = `<span class="pill">You <b>${sc[0]}</b></span><span class="pill">Opp <b>${sc[1]}</b></span><span class="pill" title="Target">→ ${tgt}</span><span class="sheet-ico" title="Score sheet">📋</span>`;
}
function renderIdle(){
  size(); applyTheme(); renderHeader();
  $('#opp').className = 'zone';
  $('#opp').innerHTML = `<div class="who"><span class="dot"></span>${oppTitle()}</div><div class="backs"></div>`;
  $('#table').innerHTML = `
    <div class="pile"><div class="pilebox" id="stock">${backHTML()}<span class="count">52</span></div><div class="lbl">Stock</div></div>
    <div class="pile"><div class="pilebox" id="disc"></div><div class="lbl">Discard</div></div>`;
  $('#lock').innerHTML = '';
  let m, sub;
  if (g && g.over){
    const o = g.over;
    m = `<b>${o.winner===0?'You won':'Opponent won'}</b> the game, ${o.totals[0]} to ${o.totals[1]}.`;
    sub = 'Press New game to play again.';
  } else { m = 'Ready when you are.'; sub = 'Press New game to deal the first hand.'; }
  $('#msg').innerHTML = `${m}<span class="sub">${sub}</span>`;
  $('#me').className = 'zone';
  $('#meLabel').textContent = 'You';
  $('#hand').innerHTML = '';
  $('#controls').innerHTML = `<button class="btn primary xl" id="newGameBtn">New game</button>` +
    (g && g.over ? `<button class="btn small" id="finalBtn">Final result</button>` : '');
}

// ---------- render ----------
function render(){
  if (isIdle()) return renderIdle();
  const cw = size();
  applyTheme();
  const h = g.hand;
  if (h.phase==='over' && (h.revealed || reveal)) return renderReveal(cw);
  renderHeader();
  // opponent
  const oppActive = h.turn===1 && h.phase!=='over';
  $('#opp').className = 'zone' + (oppActive?' active':'');
  $('#opp').innerHTML = `<div class="who"><span class="dot"></span>${oppTitle()}${g.dealer===1?' · dealer':''}</div>
    <div class="backs">${h.hands[1].map(()=>backHTML()).join('')}</div>`;
  // table
  const top = h.discard[h.discard.length-1], under = h.discard[h.discard.length-2];
  const myTurn = h.turn===0 && h.phase!=='over';
  const stockClick = myTurn && h.phase==='draw';
  const discClick = myTurn && (h.phase==='upcard' || (h.phase==='draw' && !h.mustStock) || (h.phase==='discard' && selected));
  $('#table').innerHTML = `
    <div class="pile"><div class="pilebox ${stockClick?'clickable':''}" id="stock">${h.stock.length?backHTML():''}<span class="count">${h.stock.length}</span></div><div class="lbl">Stock</div></div>
    <div class="pile"><div class="pilebox ${discClick?'clickable':''}" id="disc">${under?cardHTML(under,'under'):''}${top?cardHTML(top):''}</div><div class="lbl">Discard</div></div>`;
  $('#lock').innerHTML = `<button id="lockBtn">🔒 Deck locked before deal · <code>${h.commit.slice(0,12)}…</code></button>`;
  // message
  let m = '', sub = '';
  if (h.phase==='over') m = oppText || 'Hand over.';
  else if (h.turn===1) { m = oppText || 'Opponent is thinking…'; sub = 'Opponent’s turn'; }
  else {
    if (oppText) sub = oppText;
    if (h.phase==='upcard') m = `Take the upcard <b>${lbl(top)}</b>, or pass.`;
    else if (h.phase==='draw') m = h.mustStock ? 'Both passed — draw from the stock.' : `Draw from the stock, or take <b>${lbl(top)}</b>.`;
    else if (h.phase==='discard'){
      if (selected){
        const dw = E.bestDw(h.hands[0].filter(x=>x!==selected));
        m = `Tap <b>${lbl(selected)}</b> again (or the discard pile) to throw it. Deadwood after: <b>${dw}</b>`;
      } else m = 'Pick a card to discard.';
    }
  }
  if (errText) sub = `<span class="bad">${esc(errText)}</span>`;
  $('#msg').innerHTML = `${m}<span class="sub">${sub}</span>`;
  // my hand
  $('#me').className = 'zone' + (myTurn?' active':'');
  renderHand(cw);
  // controls
  const ctr = [];
  if (myTurn && h.phase==='upcard') ctr.push(`<button class="btn" id="passBtn">Pass</button>`);
  if (myTurn && h.phase==='discard'){
    const hand = h.hands[0];
    if (hand.length===11 && E.bestDw(hand)===0) ctr.push(`<button class="btn primary" id="bigGinBtn">Big Gin!</button>`);
    if (selected && selected!==h.taken){
      const dw = E.bestDw(hand.filter(x=>x!==selected));
      if (dw<=10) ctr.push(`<button class="btn primary" id="knockBtn">${dw===0?'Gin!':'Knock ('+dw+')'}</button>`);
    } else {
      const canK = hand.some(c=>c!==h.taken && E.bestDw(hand.filter(x=>x!==c))<=10);
      if (canK) ctr.push(`<button class="btn" disabled>Select a card to knock</button>`);
    }
  }
  ctr.push(`<button class="btn small" id="sortBtn" title="Melds stay put; only deadwood is re-sorted">Deadwood by ${settings.sort}</button>`);
  ctr.push(`<button class="btn small" id="seenBtn">Seen cards</button>`);
  $('#controls').innerHTML = ctr.join('');
  const myHand = h.hands[0];
  let dwTxt;
  if (myHand.length===11){
    const opts = myHand.filter(c=>c!==h.taken).map(c=>E.bestDw(myHand.filter(x=>x!==c)));
    dwTxt = selected ? `deadwood after discard ${E.bestDw(myHand.filter(x=>x!==selected))}` : `best deadwood after discard ${Math.min(...opts)}`;
  } else dwTxt = `deadwood ${E.bestDw(myHand)}`;
  $('#meLabel').textContent = `You${g.dealer===0?' · dealer':''} · ${dwTxt}`;
}
const meldSort = m => sortCards(m, m.every(c=>E.R(c)===E.R(m[0])) ? 'suit' : 'rank');
function meldGroups(melds, dead){
  const ms = melds.map(meldSort).sort((x,y)=>E.R(x[0])-E.R(y[0]) || SUITORDER[E.S(x[0])]-SUITORDER[E.S(y[0])]);
  const groups = ms.map((m,i)=>({cards:m, col:MELDCOL[i%4]}));
  if (dead.length) groups.push({cards:sortCards(dead, settings.sort), col:null});
  return groups;
}
function renderHand(cw){
  const h = g.hand, hand = h.hands[0];
  // Melds and sets always stay grouped on the left; the Sort button only reorders the deadwood.
  const a = E.best(hand);
  layoutRow($('#hand'), meldGroups(a.melds, a.dead), cw, c=>[c===selected?'sel':'', c===h.taken && h.phase==='discard' && h.turn===0 ? 'locked':''].join(' '));
  freshId = null;
}
// Lays out groups of cards in one row: melds left, deadwood right, each group separated when space allows.
function layoutRow(el, groups, cw, clsFor = ()=>'', top = null){
  const W = el.clientWidth || (Math.min(window.innerWidth,820)-16);
  const n = groups.reduce((k,gr)=>k+gr.cards.length, 0), gaps = groups.length-1;
  if (!n){ el.innerHTML=''; return; }
  // Prefer fully separating each group (the last card of a meld is not covered by the next group).
  let step, gap;
  const inner = n - 1 - gaps;
  step = inner > 0 ? (W - cw - gaps*(cw + 8)) / inner : cw*1.06;
  if (step >= cw*0.42){ step = Math.min(step, cw*1.06); gap = Math.max(cw*0.3, cw + 8 - step); }
  else { gap = cw*0.3; step = (W - cw - gaps*gap)/(n-1); if (step < cw*0.36){ gap = cw*0.14; step = (W - cw - gaps*gap)/(n-1); } }
  if (n===1) step = 0;
  if (n > 1 && (n-1)*step + gaps*gap + cw > W) step = Math.max(cw*0.3, (W - cw - gaps*gap)/(n-1));
  const total = (n-1)*step + gaps*gap + cw;
  let x = Math.max(0, (W-total)/2), html = '';
  groups.forEach((gr)=>{
    gr.cards.forEach((c)=>{
      html += cardHTML(c, clsFor(c), gr.col).replace('<div ', `<div style="left:${x.toFixed(1)}px${top!=null?';top:'+top+'px':''}" `);
      x += step;
    });
    x += gap;
  });
  el.innerHTML = html;
}

// ---------- end of hand: reveal on the table ----------
let reveal = null; // {stage:1|2|3} while the end-of-hand animation runs
const name = p => p===0 ? 'You' : 'Opponent';
const sumV = cards => cards.reduce((t,c)=>t+E.V(c),0);
// Arrangement of each player's cards at a given stage. Stage 1: before layoffs, 2+: after.
function revealRows(stage){
  const h = g.hand, r = h.result, rows = [null, null];
  if (r.type==='draw'){
    for (const p of [0,1]){ const a = E.best(h.hands[p]); rows[p] = {groups: meldGroups(a.melds, a.dead), dw: a.dw, laid: new Set()}; }
    return rows;
  }
  const kp = r.knockerP, dp = 1-kp, laid = r.defender.laid || [], after = stage >= 2;
  const kMelds = r.knocker.melds.map((m,i)=> after ? m.concat(laid.filter(l=>l.meld===i).map(l=>l.card)) : m);
  rows[kp] = {groups: meldGroups(kMelds, r.knocker.dead), dw: r.knocker.dw, laid: new Set(after ? laid.map(l=>l.card) : [])};
  const dDead = after ? r.defender.dead : r.defender.dead.concat(laid.map(l=>l.card));
  rows[dp] = {groups: meldGroups(r.defender.melds, dDead), dw: after ? r.defender.dw : sumV(dDead), laid: new Set()};
  return rows;
}
function renderReveal(cw){
  const h = g.hand, r = h.result, stage = reveal ? reveal.stage : 3;
  const rows = revealRows(stage);
  const showScores = stage >= 3;
  renderHeader(showScores ? null : h.prevScores);
  const ocw = Math.round(cw*0.82), och = Math.round(ocw*1.4);
  const kp = r.type==='draw' ? -1 : r.knockerP;
  const tag = p => r.type==='draw' ? '' : p===kp ? ({gin:' · gin', bigGin:' · big gin'}[r.type] || ' · knocked') : '';
  $('#opp').className = 'zone';
  $('#opp').innerHTML = `<div class="who"><span class="dot"></span>Opponent${tag(1)} · deadwood <b class="dw">${rows[1].dw}</b></div>
    <div id="oppHand" style="--cw:${ocw}px;--ch:${och}px;height:${och+10}px"></div>`;
  layoutRow($('#oppHand'), rows[1].groups, ocw, c=>rows[1].laid.has(c)?'laid':'');
  // table stays as it was
  const top = h.discard[h.discard.length-1], under = h.discard[h.discard.length-2];
  $('#table').innerHTML = `
    <div class="pile"><div class="pilebox" id="stock">${h.stock.length?backHTML():''}<span class="count">${h.stock.length}</span></div><div class="lbl">Stock</div></div>
    <div class="pile"><div class="pilebox" id="disc">${under?cardHTML(under,'under'):''}${top?cardHTML(top):''}</div><div class="lbl">Discard</div></div>`;
  $('#lock').innerHTML = `<button id="lockBtn">🔒 Deck locked before deal · <code>${h.commit.slice(0,12)}…</code></button>`;
  $('#me').className = 'zone';
  $('#meLabel').innerHTML = `You${tag(0)} · deadwood <b class="dw">${rows[0].dw}</b>`;
  layoutRow($('#hand'), rows[0].groups, cw, c=>rows[0].laid.has(c)?'laid':'');
  // message
  let m, sub = '';
  if (r.type==='draw'){ m = '<span class="verdict">Dead hand — no score</span>'; sub = 'The stock ran down to two cards without anyone knocking.'; }
  else {
    const K = name(kp), D = name(1-kp), laid = (r.defender.laid||[]).map(l=>lbl(l.card));
    const poss = (p, cap) => p===0 ? (cap?'Your':'your') : 'Opponent’s';
    const opener = {gin:`${K} went Gin!`, bigGin:`${K} went Big Gin!`}[r.type] || `${K} knocked with ${r.knocker.dw} deadwood.`;
    if (stage===1){ m = opener; sub = (r.type==='gin'||r.type==='bigGin') ? 'No laying off against gin.' : laid.length ? `${D} can lay off ${laid.join(' ')}…` : `${D} has nothing to lay off.`; }
    else if (stage===2){ m = opener; sub = `${D} laid off ${laid.join(' ')} — deadwood now ${r.defender.dw}.`; }
    else {
      m = `<span class="verdict">${r.type==='undercut'?'Undercut! ':''}<b>${name(r.winnerP)} +${r.points}</b></span>`;
      sub = r.type==='knock' ? `${poss(1-kp,true)} ${r.defender.dw} − ${poss(kp)} ${r.knocker.dw} deadwood = ${r.points}`
          : r.type==='undercut' ? `${poss(1-kp,true)} ${r.defender.dw} deadwood ≤ ${poss(kp)} ${r.knocker.dw}: ${E.BONUS.undercut} bonus + ${r.knocker.dw - r.defender.dw}`
          : `${r.type==='gin'?'Gin':'Big Gin'} bonus ${r.type==='gin'?E.BONUS.gin:E.BONUS.bigGin} + ${poss(1-kp)} ${r.defender.dw} deadwood`;
    }
  }
  $('#msg').innerHTML = `${m}<span class="sub">${sub}</span>`;
  $('#controls').innerHTML = reveal ? '' :
    `<button class="btn small" id="detailsBtn">Hand details</button>` +
    (g.over ? `<button class="btn primary" id="finalBtn">Final result</button>` : `<button class="btn primary" id="nextBtn">Next hand</button>`);
}
const anyCardEl = id => document.querySelector(`#hand .card[data-id="${id}"], #oppHand .card[data-id="${id}"]`);
function startReveal(){
  const h = g.hand, r = h.result;
  if (h.revealed || reduceMotion || !speed()){ h.revealed = true; reveal = null; save(); render(); return; }
  const backR = oppBacks().map(rectOf), prevMine = handPositions();
  reveal = { stage: 1 }; render(); slideHand(prevMine);
  // Opponent's cards flip over as they move into melds and deadwood.
  document.querySelectorAll('#oppHand .card').forEach((el,i)=>{
    const from = backR[Math.min(i, backR.length-1)] || rectOf($('#opp'));
    fly(from, el, el.dataset.id, 'down', 'up', MOVE_MS, i*45);
  });
  const T = ms => ms * speed();
  const laid = (r.defender && r.defender.laid) || [];
  const finish = () => { reveal = null; h.revealed = true; save(); render(); };
  setTimeout(()=>{
    if (laid.length){
      const from = {}; laid.forEach(l=>from[l.card] = rectOf(anyCardEl(l.card)));
      const prev = handPositions();
      reveal.stage = 2; render(); slideHand(prev);
      laid.forEach((l,i)=>fly(from[l.card], anyCardEl(l.card), l.card, 'up', 'up', MOVE_MS*1.1, i*220));
    }
    setTimeout(()=>{
      reveal.stage = 3; render();
      if (r.type!=='draw') popScore(r.winnerP, r.points, h.prevScores[r.winnerP]);
      setTimeout(finish, T(1100));
    }, T(laid.length ? 900 + laid.length*220 : 500));
  }, T(1300));
}
// "+17" rises from the message and lands on the winner's score, which counts up.
function popScore(p, pts, from){
  const pill = document.querySelectorAll('#score .pill')[p], msg = $('#msg .verdict') || $('#msg');
  if (!pill || !msg) return;
  const a = rectOf(msg), b = rectOf(pill), el = document.createElement('div');
  el.className = 'pop'; el.textContent = '+' + pts; document.body.appendChild(el);
  const x0 = a.left + a.width/2 - 30, y0 = a.top - 10, x1 = b.left + b.width/2 - 30, y1 = b.top;
  const dur = 900 * speed();
  const an = el.animate([
    {transform:`translate(${x0}px,${y0}px) scale(.6)`, opacity:0},
    {transform:`translate(${x0}px,${y0-30}px) scale(1.25)`, opacity:1, offset:.3},
    {transform:`translate(${x1}px,${y1}px) scale(.5)`, opacity:.2}], {duration:dur, easing:'cubic-bezier(.3,.7,.3,1)', fill:'both'});
  an.onfinish = () => {
    el.remove();
    const num = pill.querySelector('b'), to = from + pts, t0 = performance.now(), d = 450 * speed();
    pill.classList.add('bump');
    (function tick(t){ const k = Math.min(1, (t - t0) / d); num.textContent = Math.round(from + (to - from) * k); if (k < 1) requestAnimationFrame(tick); })(t0);
  };
}

// ---------- events ----------
document.addEventListener('click', e=>{
  const t = e.target;
  if (modalOpen){
    if (t.id==='modal') closeModal();
    return;
  }
  if (t.closest('#menuBtn')) return showMenu();
  if (t.closest('#score')) return showScoreSheet();
  if (t.closest('#newGameBtn')) return newGame();
  if (t.closest('#finalBtn')) return showGameOver();
  if (isIdle()) return;
  if (g.hand.phase==='over'){
    if (t.closest('#nextBtn')) return startHand();
    if (t.closest('#detailsBtn')) return showShowdown();
    if (t.closest('#lockBtn')) return showFairness();
    return;
  }
  const busy = Date.now() < dealUntil - 80;
  if (busy && t.closest('#stock, #disc, #hand, #passBtn, #knockBtn, #bigGinBtn')) return;
  if (t.closest('#stock')) return onStock();
  if (t.closest('#disc')) return onDiscardPile();
  const card = t.closest('#hand .card'); if (card) return onCard(card.dataset.id);
  if (t.closest('#passBtn')) return doPass();
  if (t.closest('#knockBtn')) return doKnock();
  if (t.closest('#bigGinBtn')) return doBigGin();
  if (t.closest('#sortBtn')){ settings.sort = settings.sort==='suit' ? 'rank' : 'suit'; save(); return render(); }
  if (t.closest('#seenBtn')) return showSeen();
  if (t.closest('#lockBtn')) return showFairness();
  if (t.closest('#menuBtn')) return showMenu();
  if (!t.closest('.btn') && selected && g.hand.phase==='discard'){ selected=null; render(); }
});

function openModal(html, onClick){
  modalOpen = true;
  $('#sheet').innerHTML = html;
  $('#modal').hidden = false;
  $('#sheet').onclick = ev => onClick && onClick(ev);
}
function closeModal(){ modalOpen = false; $('#modal').hidden = true; $('#sheet').onclick = null; }
function copyText(txt, btn){
  const done = ()=>{ if(btn){ const o=btn.textContent; btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent=o,1400);} };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement('textarea'); ta.className='copyfb'; ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); }
}
function miniGroup(cards, cls='', laidSet=new Set()){
  return `<div class="grp ${cls}">${cards.map(c=>cardHTML(c, laidSet.has(c)?'laid':'')).join('')}</div>`;
}

function showShowdown(){
  const h = g.hand, r = h.result;
  let title, big = '';
  const name = p => p===0 ? 'You' : 'Opponent';
  if (r.type==='draw'){ title = 'Dead hand'; big = 'No score — only two cards left in the stock.'; }
  else {
    const k = name(r.knockerP);
    title = {gin:`${k} went Gin`, bigGin:`${k} went Big Gin`, knock:`${k} knocked`, undercut:`Undercut!`}[r.type];
    big = `<span class="big">${name(r.winnerP)} +${r.points}</span>`;
  }
  let body = `<h2>${title}</h2><div>${big}</div>`;
  if (r.type!=='draw'){
    const kp = r.knockerP, dp = 1-kp;
    const laidByMeld = {}; (r.defender.laid||[]).forEach(l=>(laidByMeld[l.meld]=laidByMeld[l.meld]||[]).push(l.card));
    const laidSet = new Set((r.defender.laid||[]).map(l=>l.card));
    const kRow = r.knocker.melds.map((m,i)=>miniGroup(sortCards(m.concat(laidByMeld[i]||[]),'rank'),'',laidSet)).join('') + (r.knocker.dead.length?miniGroup(sortCards(r.knocker.dead,'suit'),'deadgrp'):'');
    const dRow = r.defender.melds.map(m=>miniGroup(sortCards(m,'suit'))).join('') + (r.defender.dead.length?miniGroup(sortCards(r.defender.dead,'suit'),'deadgrp'):'');
    body += `<h3>${name(kp)} (knocked) — deadwood ${r.knocker.dw}</h3><div class="handrow mini">${kRow}</div>`;
    if (h.knockCard) body += `<div class="tag">Discarded ${lbl(h.knockCard)} face down to knock.</div>`;
    body += `<h3>${name(dp)} — deadwood ${r.defender.dw}${laidSet.size?` after laying off ${[...laidSet].map(lbl).join(' ')}`:''}</h3><div class="handrow mini">${dRow}</div>`;
    if (laidSet.size) body += `<div class="tag">Cards outlined in blue were laid off onto the knocker’s melds.</div>`;
    if (r.type==='knock') body += `<p>${r.defender.dw} − ${r.knocker.dw} = ${r.points} points.</p>`;
    if (r.type==='undercut') body += `<p>The defender matched or beat the knocker’s deadwood: ${E.BONUS.undercut} bonus + ${r.knocker.dw} − ${r.defender.dw}.</p>`;
    if (r.type==='gin'||r.type==='bigGin') body += `<p>${r.type==='gin'?E.BONUS.gin:E.BONUS.bigGin} bonus + ${r.defender.dw} opponent deadwood. No laying off against gin.</p>`;
  } else {
    body += `<h3>Opponent’s hand</h3><div class="handrow mini">${miniGroup(sortCards(h.hands[1],'suit'))}</div>`;
  }
  // fairness
  const okCommit = E.sha256hex(h.seed) === h.commit;
  const okDeck = E.deckFromSeed(h.seed).join(' ') === h.deck.join(' ');
  body += `<h3>Fairness check</h3>
    <p class="${okCommit&&okDeck?'ok':'bad'}">${okCommit?'✓':'✗'} SHA-256 of the revealed seed matches the lock shown before the deal.<br>${okDeck?'✓':'✗'} Rebuilding the deck from the seed gives exactly the cards that were dealt and drawn.</p>
    <div class="mono">lock ${h.commit}<br>seed ${h.seed}</div>
    <div class="row" style="margin-top:8px"><button class="btn small" data-copy="seed">Copy seed</button><button class="btn small" data-copy="deck">Copy deck order</button><button class="btn small" data-act="fair">How to verify yourself</button></div>
    <details><summary>Opponent’s reasoning this hand (${h.aiLog.length} decisions)</summary><ol class="log">${h.aiLog.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <div class="tag">Its inputs were only its own cards, the discard pile, the cards you picked up from it, and the stock count, limited to what it remembered (${MEM_LABEL[settings.memory]}).</div></details>`;
  const s = g.scores;
  body += `<h3>Score</h3><p>You <b>${s[0]}</b> · Opponent <b>${s[1]}</b> — first to ${g.target}</p>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="next">${g.over?'Final result':'Next hand'}</button><button class="btn" data-act="close">Back to table</button></div>`;
  openModal(body, ev=>{
    const b = ev.target.closest('button'); if(!b) return;
    if (b.dataset.copy==='seed') copyText(h.seed, b);
    if (b.dataset.copy==='deck') copyText(h.deck.map(c=>c).join(' '), b);
    if (b.dataset.act==='fair') showFairness(true);
    if (b.dataset.act==='next'){ closeModal(); if (g.over) showGameOver(); else startHand(); }
    if (b.dataset.act==='close') closeModal();
  });
}

function showSeen(){
  const h = g.hand, mem = settings.memory || 'human';
  // Exactly what the opponent's code would receive right now, at this memory level.
  const v = E.aiView(g, 1, settings.difficulty, mem);
  const mine = new Set(h.hands[0]), opp = new Set(h.picked[1]);
  const remembered = new Set(v.discardPile), forgotten = new Set(h.discard.filter(c=>!remembered.has(c)));
  const knowsYouHave = new Set(v.oppPicked.filter(c=>mine.has(c)));
  const wrong = new Set(v.misremembered.map(x=>x[1]));
  let grid = '';
  for (const s of ['S','H','C','D']) for (const r of E.RANKS){
    const id = r+s;
    const cls = mine.has(id) ? 'mine' + (knowsYouHave.has(id)?' known':'') : opp.has(id) ? 'opp' : wrong.has(id) ? 'wrong'
      : remembered.has(id) ? 'gone' : forgotten.has(id) ? 'faded' : '';
    grid += `<div class="cell ${cls} ${(s==='H'||s==='D')?'r':''}" title="${lbl(id)}">${r==='T'?'10':r}<span>${E.SYM[s]}</span></div>`;
  }
  const intro = mem==='perfect'
    ? 'The opponent has perfect memory: it knows everything on this chart, and nothing else.'
    : `This chart shows what the opponent remembers right now (${MEM_LABEL[mem]}). Faded cells are discards it has forgotten.`;
  openModal(`<h2>Seen cards</h2>
    <p>${intro}</p>
    <div class="grid">${grid}</div>
    <div class="lgd">
      <div><i class="cell mine">7</i>In your hand</div>
      <div><i class="cell mine known">7</i>In your hand, and the opponent knows (you took it from the pile)</div>
      <div><i class="cell opp">7</i>In the opponent’s hand (it took it from the pile)</div>
      <div><i class="cell gone">7</i>Discarded, and it remembers</div>
      ${mem!=='perfect'?'<div><i class="cell faded">7</i>Discarded, but it has forgotten</div><div><i class="cell wrong">7</i>It wrongly thinks you picked this up</div>':''}
      <div><i class="cell">7</i>Unknown (stock or opponent’s hand)</div></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="close">Close</button></div>`,
    ev=>{ if(ev.target.closest('[data-act=close]')) closeModal(); });
}

const PY = `import hashlib, sys
seed = sys.argv[1]
deck = [r + s for s in "SHDC" for r in "A23456789TJQK"]
words, i = [], 0
def nxt():
    global words, i
    if not words:
        h = hashlib.sha256(f"{seed}:{i}".encode()).digest(); i += 1
        words = [int.from_bytes(h[k:k+4], "big") for k in range(0, 32, 4)]
    return words.pop(0)
for j in range(51, 0, -1):
    n = j + 1; lim = (2**32 // n) * n
    while True:
        u = nxt()
        if u < lim: break
    r = u % n; deck[j], deck[r] = deck[r], deck[j]
print("lock:", hashlib.sha256(seed.encode()).hexdigest())
print("deck:", " ".join(deck))`;

function showFairness(fromShowdown){
  const h = g && g.hand;
  const hist = history.slice(0,12).map(x=>`<tr><td>#${x.n}</td><td class="mono">${x.commit.slice(0,10)}…</td><td style="text-align:left">${esc(x.res)}</td><td><button class="btn small" data-seed="${x.seed}">Copy seed</button></td></tr>`).join('');
  openModal(`<h2>Why this game can’t be rigged</h2>
    <p><b>1. The deck is fixed before the deal.</b> Each hand starts with a random 256-bit seed from your device’s secure random generator. The full 52-card order comes from that seed, and its SHA-256 fingerprint (the “lock”) is shown before any card is dealt. Nothing can reorder the stock afterwards, so the game can’t slip the opponent a perfect card or keep the one you need away from you.</p>
    <p><b>2. The seed is revealed after every hand.</b> Run the script below on the seed and you get the same lock and the exact deck order. Cards are dealt from the start of that list: one to the non-dealer, one to the dealer, alternating, until each has 10. The 21st card is the upcard, and the stock is drawn in order after that.</p>
    <p><b>3. The opponent plays blind.</b> Its code only ever gets: its own 10–11 cards, the discard pile, the cards you picked up from the discard pile, and how many cards are left in the stock. It never sees your hand or the stock. With Human or Forgetful memory it gets even less: only the public cards it still remembers. After each hand you can read its reasoning, and the “Seen cards” chart shows exactly what it remembers.</p>
    <p><b>4. Same rules for both players.</b> One set of rule functions checks every move, yours and its.</p>
    ${h && h.phase!=='over' && !g.over?`<h3>Current hand lock</h3><div class="mono">${h.commit}</div><div class="tag">Write down the first few characters and compare them after the hand.</div>`:''}
    <h3>Check it independently (Python 3)</h3>
    <pre class="code mono">${esc(PY)}</pre>
    <div class="row"><button class="btn small" data-act="copypy">Copy script</button><span class="tag">Save it as verify.py, then run: python3 verify.py &lt;seed&gt;</span></div>
    ${hist?`<h3>Recent hands</h3><table class="t">${hist}</table>`:''}
    <div class="row" style="margin-top:14px"><button class="btn" data-act="back">${fromShowdown?'Back to results':'Close'}</button></div>`,
  ev=>{
    const b = ev.target.closest('button'); if(!b) return;
    if (b.dataset.seed) copyText(b.dataset.seed, b);
    if (b.dataset.act==='copypy') copyText(PY, b);
    if (b.dataset.act==='back'){ if (fromShowdown) showShowdown(); else closeModal(); }
  });
}

    if (a==='rules') showRules();
    if (a==='look') showAppearance();
    if (a==='reset'){ if (b.dataset.confirm){ Object.assign(stats,{byMem:{},games:0,gamesWon:0,hands:0,handsWon:0,aiHandsWon:0,draws:0,gins:0,aiGins:0,undercuts:0,aiUndercuts:0,startSum:[0,0],startN:0}); save(); showMenu(); } else { b.dataset.confirm='1'; b.textContent='Tap again to reset'; } }
    if (a==='close') closeModal();
  });
}

function showAppearance(){
  const S = settings;
  const seg = (key, opts) => `<div class="seg">${Object.entries(opts).map(([k,l])=>`<button data-set="${key}" data-val="${k}" class="${S[key]===k?'on':''}">${l}</button>`).join('')}</div>`;
  const tables = Object.entries(TABLES).map(([k,[a,b,l]])=>`<button class="sw ${S.table===k?'on':''}" data-set="table" data-val="${k}" title="${l}" style="background:radial-gradient(circle at 40% 35%,${a},${b})"></button>`).join('');
  const backs = Object.entries(BACKS).map(([k,[a,,,l]])=>`<button class="swcard ${S.back===k?'on':''}" data-set="back" data-val="${k}" title="${l}"><div class="card back" style="--back1:${a};--back2:${BACKS[k][1]};--backrim:${BACKS[k][2]}"></div></button>`).join('');
  const prev = `<div class="preview">${cardHTML('AS')}${cardHTML('7H')}${cardHTML('QD')}${cardHTML('TC')}${backHTML()}</div>`;
  openModal(`<h2>Appearance</h2>
    ${prev}
    <h3>Animation speed</h3>${seg('speed', {off:'Off', fast:'Fast', normal:'Normal', slow:'Slow'})}
    <div class="tag" style="margin-top:6px">Also sets how long the opponent pauses between moves.</div>
    <h3>Table</h3><div class="swatches">${tables}
      <label class="colorpick ${S.table==='custom'?'on':''}"><input type="color" id="tableColor" value="${S.tableCustom}">Custom${S.table==='custom'?' ✓':''}</label></div>
    <h3>Card face</h3>${seg('face', Object.fromEntries(Object.entries(FACES).map(([k,[,l]])=>[k,l])))}
    <div class="row" style="margin-top:8px"><button class="btn small" data-act="four">${S.fourColor?'✓ ':''}Four-colour suits (♦ blue, ♣ green)</button></div>
    <h3>Card back colour</h3><div class="swatches">${backs}
      <label class="colorpick"><input type="color" id="backColor" value="${S.backCustom}">Custom${S.back==='custom'?' ✓':''}</label></div>
    <h3>Card back pattern</h3>${seg('backPattern', PATTERNS)}
    <div class="row" style="margin-top:16px"><button class="btn" data-act="reset">Reset to defaults</button><button class="btn primary" data-act="close">Done</button></div>`,
  ev=>{
    const b = ev.target.closest('button'); if(!b) return;
    if (b.dataset.set){ S[b.dataset.set] = b.dataset.val; }
    else if (b.dataset.act==='four') S.fourColor = !S.fourColor;
    else if (b.dataset.act==='reset') Object.assign(S, {speed:'normal', table:'green', face:'classic', back:'burgundy', backPattern:'lattice', fourColor:false});
    else if (b.dataset.act==='close'){ closeModal(); return; }
    else return;
    save(); render(); showAppearance();
  });
  const live = (id, key, mode) => { const el = document.getElementById(id); if (!el) return;
    el.addEventListener('input', ()=>{ S[key] = el.value; S[mode[0]] = mode[1]; save(); applyTheme(); });
    el.addEventListener('change', ()=>{ render(); showAppearance(); }); };
  live('tableColor', 'tableCustom', ['table','custom']);
  live('backColor', 'backCustom', ['back','custom']);
}

function showRules(){
  openModal(`<h2>Rules</h2>
    <p>Each player gets 10 cards. Form <b>melds</b>: sets of 3–4 of the same rank, or runs of 3+ in one suit (ace is low). Unmelded cards are <b>deadwood</b>: aces count 1, number cards their face value, and court cards 10.</p>
    <p><b>Upcard:</b> the non-dealer can take the first upcard or pass, then the dealer can. If both pass, the non-dealer draws from the stock.</p>
    <p><b>Your turn:</b> draw from the stock or take the top discard, then discard one card. You can’t throw back a card you just picked up from the discard pile.</p>
    <p><b>Knock:</b> once your deadwood is 10 or less after discarding, you can knock. The other player then lays off deadwood onto your melds.</p>
    <ul style="color:#d9e4de;padding-left:18px">
      <li>Knocker has less deadwood: scores the difference.</li>
      <li>Defender has equal or less deadwood: <b>undercut</b>. The defender scores ${E.BONUS.undercut} + the difference.</li>
      <li><b>Gin</b> (0 deadwood): ${E.BONUS.gin} + opponent’s deadwood, and they can’t lay off. <b>Big Gin</b> (all 11 cards melded): ${E.BONUS.bigGin} + deadwood.</li>
    </ul>
    <p>If the stock is down to 2 cards and nobody has knocked, the hand is dead and the same dealer deals again.</p>
    <p><b>Tip — the opponent’s memory:</b> a sharp player remembers every discard and every card you pick up, and uses that to guess what you’re collecting. Choose how much the computer remembers in the menu under Opponent memory: <b>Perfect</b> remembers everything, <b>Human</b> (the default) gradually forgets older discards, sometimes misremembers your pickups and overlooks the odd useful card, and <b>Forgetful</b> mostly reacts to the top of the pile. Tap <b>Seen cards</b> any time to see what it remembers right now.</p>
    <p><b>Game:</b> first to the target. Winner gets +${E.BONUS.game}, both get +${E.BONUS.box} per hand won, and a shutout doubles the winner’s total.</p>
    <p><b>Controls:</b> tap the stock or discard pile to draw. Tap a card to select it, then tap it again (or tap the discard pile) to discard. Select a card and press Knock to knock with it.</p>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="close">Close</button></div>`,
  ev=>{ if(ev.target.closest('[data-act=close]')) closeModal(); });
}

// ---------- boot ----------
applyTheme();
// A game only starts when you press New game.
if (g && !g.log) g.log = [];
render();
if (!isIdle()){ if (g.hand.phase==='over'){ if (!g.hand.applied) handOver(); } else maybeAI(); }
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{}); } catch(e){}
})();
</script>
</body>
</html>
